apiVersion: v1
kind: Secret
metadata:
  name: astra-x-secret
  namespace: astra-x
  labels:
    app.kubernetes.io/name: astra-x
    app.kubernetes.io/part-of: astra-x
type: Opaque
stringData:
  # 🔒 Replace with a strong random key:
  #   python -c "import secrets; print(secrets.token_hex(32))"
  ASTRA_SECRET_KEY: "change-me-to-a-random-64-char-hex-string-in-production"
  # 🔒 Optional: API key for OpenAI-compatible provider
  ASTRA_OPENAI_COMPATIBLE_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: astra-x
  labels:
    app.kubernetes.io/name: astra-x
    app.kubernetes.io/part-of: astra-x
type: Opaque
stringData:
  # 🔒 Generate a random password:
  #   python -c "import secrets; print(secrets.token_hex(16))"
  password: ""
  database-url: "postgresql+asyncpg://astra:CHANGEME@postgres:5432/astra"
---
apiVersion: v1
kind: Secret
metadata:
  name: astra-x-database-url
  namespace: astra-x
  labels:
    app.kubernetes.io/name: astra-x
    app.kubernetes.io/part-of: astra-x
type: Opaque
stringData:
  # 🔒 Production database URL (password embedded). Generate with:
  #   python -c "import secrets; pw=secrets.token_hex(16); print(f'postgresql+asyncpg://astra:{pw}@postgres:5432/astra')"
  ASTRA_DATABASE_URL: "postgresql+asyncpg://astra:CHANGEME@postgres:5432/astra"
