apiVersion: v1
kind: Service
metadata:
  name: astra-x-backend
  namespace: astra-x
  labels:
    app.kubernetes.io/name: astra-x
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: astra-x
spec:
  selector:
    app.kubernetes.io/name: astra-x
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: astra-x
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: astra-x
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  clusterIP: None  # headless for StatefulSet
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: astra-x
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: astra-x
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  type: ClusterIP
