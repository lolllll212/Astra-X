apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: astra-x
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: astra-x
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: ssd  # uncomment if you have a specific storage class
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: astra-x-data
  namespace: astra-x
  labels:
    app.kubernetes.io/name: astra-x
    app.kubernetes.io/part-of: astra-x
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
