apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astra-x-ingress
  namespace: astra-x
  labels:
    app.kubernetes.io/name: astra-x
    app.kubernetes.io/part-of: astra-x
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.astra-x.example.com
      secretName: astra-x-tls
  rules:
    - host: api.astra-x.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: astra-x-backend
                port:
                  name: http
