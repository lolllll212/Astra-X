[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "astra-x-backend"
version = "0.1.0"
description = "Astra X — a production-grade, modular, local-first AI assistant backend."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Astra X Engineering Team" }]
keywords = ["ai", "assistant", "llm", "fastapi", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

dependencies = [
    # --- Web framework / server ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "sse-starlette>=2.2.1",
    "python-multipart>=0.0.20",

    # --- Validation / configuration ---
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # --- Persistence ---
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.1",
    "alembic>=1.14.0",

    # --- HTTP client (used by LLM provider adapters) ---
    "httpx>=0.28.0",

    # --- Observability ---
    "structlog>=24.4.0",

    # --- Serialization / performance ---
    "orjson>=3.10.0",

    # --- Dependency injection ---
    "dependency-injector>=4.42.0",
]

[project.optional-dependencies]
# Vector store backends for future RAG support. Kept optional so the
# default install stays lean; the retrieval service layer will depend
# only on an internal VectorStore interface, never on these packages
# directly.
vector = [
    "faiss-cpu>=1.9.0",
    "chromadb>=0.5.20",
]

# Optional caching / pub-sub backend for future multi-user and
# real-time features.
redis = [
    "redis>=5.2.0",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
eva = "evals.runner:main"

[project.urls]
Repository = "https://github.com/astra-x/astra-x"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff: linting + formatting (single tool, replaces black/isort/flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ASYNC", # flake8-async
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy: strict static typing, enforcing "type hints everywhere"
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "dependency_injector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "evals.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
warn_unused_ignores = false
disable_error_code = ["type-arg"]

# ---------------------------------------------------------------------------
# Pytest: async-first test configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning"]