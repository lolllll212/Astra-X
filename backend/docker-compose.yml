version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ASTRA_HOST=0.0.0.0
      - ASTRA_DATABASE_URL=sqlite+aiosqlite:///app/data/astra_x.db
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  app_data:
  redis_data:
